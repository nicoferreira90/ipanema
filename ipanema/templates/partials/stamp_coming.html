<!-- one coming-soon stamp. Expects `m`. Rotation is left to the caller's CSS. -->
<div class="stamp opacity-85">
  <div class="stamp-inner p-7" style="background:#f8edd9">
    <div class="rubber-stamp">drifting ashore</div>
    <div class="flex items-start justify-between gap-4 opacity-50">
      <div>
        <p class="mono text-[.62rem] uppercase tracking-[.22em]" style="color:var(--teal)">{{ m.part }}</p>
        <h3 class="display text-3xl font-black mt-2 leading-tight" style="color:var(--ink-deep)">{{ m.title }}</h3>
      </div>
      <div class="stamp-value text-2xl shrink-0" style="color:var(--{{ m.color }})">{{ m.number|stringformat:"02d" }}</div>
    </div>
    <p class="serif-it text-xl mt-3 opacity-50" style="color:var(--coral)">{{ m.tagline }}</p>
    <div class="mt-10 pt-4 opacity-50" style="border-top: 2px solid var(--ink)">
      <span class="mono text-[.66rem] uppercase tracking-[.14em]">unissued · awaits printing</span>
    </div>
  </div>
</div>
